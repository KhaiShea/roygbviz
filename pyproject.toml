[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roygbviz"
version = "0.1.0"
description = "A rainbow theme and palette for plotnine: twelve colours, light and dark, made for research figures people can actually follow."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Khai Dye-Brinkman" }]
keywords = ["plotnine", "matplotlib", "theme", "palette", "dark mode", "rainbow", "data visualisation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = ["plotnine>=0.14", "matplotlib>=3.8", "mizani>=0.13"]

[project.optional-dependencies]
dev = ["pytest", "pandas", "numpy", "pillow", "build", "twine"]

[project.urls]
Homepage = "https://github.com/KhaiShea/roygbviz"
Issues = "https://github.com/KhaiShea/roygbviz/issues"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/roygbviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
